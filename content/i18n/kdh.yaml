facts:
  fact_water_depth: "Lepaih tabur, biaq tanah lembap seminggu. Lepaih tu jaga ayaq 5–7 cm, pastu 5–10 cm masa padi beranak."
  fact_drain_before_harvest: "Keringkan petak 10–14 hari sebelum tuai, baru padi masak sekata dan senang jentuai masuk."
  fact_harvest_85: "Tuai bila 85–90% bulir dah kuning. Awai sangat, padi muda kena potong. Lambat sangat, bulir gugoq."
  fact_four_fertiliser: "Baja padi ada empat peringkat ikut umur padi. MADA agih baja sebatian dengan urea ikut peringkat."
  fact_seed_soak: "Benih kena rendam 24 jam, pastu peram 24–48 jam sampai bercambah, baru tabur."
  fact_plough_timing: "Bajak kena ikut masa: 30 hari sebelum tanam kalau kering, 7–10 hari, atau 1–2 hari kalau tanah basah."
  fact_snail_first_month: "Siput gondang emas paling bahaya masa anak padi umur 2–4 minggu. Serangan teruk boleh habih sampai 93% hasil."
  fact_weed_window: "Rumpai paling bahaya awal musim. Kalau tak cabut masa tu, hasil jatuh."
  fact_floor_price: "Harga lantai padi RM1,500 satu tan, campuq subsidi RM500 satu tan."
  fact_cost_per_hectare: "Kos tanam padi sekarang lebih kurang RM6,000–7,000 sehektar. Untung pesawah nipis ja."
  fact_tikus_bukan_bencana: "Serangan tikus tak kira bencana, so takdak pampasan. Sebab tu orang kampung buat gotong-royong buru tikus."
  fact_mr297: "MR297 benih paling popular kat kawasan Muda. Ramai sangat nak, sampai kadang-kadang tak cukup."
  fact_cl2_blast: "MR220 CL2 dibawak masuk nak lawan padi angin. Tapi tahun 2015, hampir 80% kes karah kat Muda kena sawah hat tanam varieti ni."
  fact_mrq76: "MRQ76 padi wangi tempatan. MARDI kaji jarak tanam dengan umur semai dia."
  fact_fish_in_bendang: "Masa bajak, haruan, keli, puyu dengan sepat timbul dalam lumpuq. Orang Padang Terap ikut belakang traktor bawak serkap."
  fact_agribank_loan: "Bank pertanian bagi pinjaman modal musim, bayaq lepaih tuai. Ramai pesawah pinjam RM7,000–10,000 untuk lebih kurang tiga hektar."
  fact_hand_vs_machine: "Sewa traktor dengan jentuai makin mahai sebab diesel takdak subsidi. Buat sendiri jimat duit, tapi makan masa."
  fact_padi_angin: "Padi angin tu padi liar. Rupa sama macam padi, tapi tinggi sikit dan bijinya gugoq awai. Kat kawasan MADA, dia boleh potong hasil 60–90%."  # TODO proofread
  fact_phone_rice: "Rendam fon basah dalam beras tu mitos. Apple sendiri pesan jangan: habuk beras boleh masuk dalam fon. Keringkan dengan angin ja."  # TODO proofread

