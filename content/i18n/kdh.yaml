# Loghat Kedah: the default language. Proofread by Yon before release.
# Rules: talk to the player as "hang"; NPCs call themselves "saya" (or "aku" with close friends).
# Tok is the exception: Tok calls themself "Tok", as Kedah grandparents do.
# Do not use "cheq" for now: it reads soft and manja. Reserved for a possible future cutesy NPC.
# Keep button labels short and readable for non-Kedahans; put the full loghat in dialogue, cards and toasts.
# Placeholders in {braces} are filled by code. Keep keys identical to en.yaml.

