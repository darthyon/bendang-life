facts:
  fact_water_depth: "After sowing, keep the soil saturated for about a week. Then hold water at 5–7 cm, and 5–10 cm while the plants tiller."
  fact_drain_before_harvest: "Drain the plot 10–14 days before harvest so the grain ripens evenly and harvesters can get in."
  fact_harvest_85: "Harvest when 85–90% of the grains are yellow. Too early cuts immature grain; too late and grain falls off."
  fact_four_fertiliser: "Padi is fertilised in four stages by crop age. MADA distributes compound fertiliser and urea by stage."
  fact_seed_soak: "Soak seed for 24 hours, then keep it covered for 24–48 hours until it sprouts, then sow."
  fact_plough_timing: "Plough 30 days before sowing in dry conditions, 7–10 days before in general, or 1–2 days before in wet conditions."
  fact_snail_first_month: "Golden apple snails do the most damage in the first 2–4 weeks. Severe attacks can destroy up to 93% of the yield."
  fact_weed_window: "Weeds do the most harm early in the season. Miss that window and yield drops."
  fact_floor_price: "The padi floor price is RM1,500 per tonne, plus a subsidy of RM500 per tonne."
  fact_cost_per_hectare: "Growing padi now costs about RM6,000–7,000 per hectare. Farmers' margins are thin."
  fact_tikus_bukan_bencana: "Rat damage is not classed as a disaster, so there is no compensation. Villages organise rat hunts together instead."
  fact_mr297: "MR297 is the most popular variety in the Muda area. Demand is so high that supply sometimes runs short."
  fact_cl2_blast: "MR220 CL2 was introduced to fight weedy rice, but in 2015 nearly 80% of blast cases in Muda were on fields growing it."
  fact_mrq76: "MRQ76 is a local fragrant variety. MARDI has studied its planting distance and seedling age."
  fact_fish_in_bendang: "When fields are ploughed, snakehead, catfish, climbing perch and gourami surface in the mud. Villagers in Padang Terap follow the tractor with fish traps."
  fact_agribank_loan: "The agricultural bank lends seasonal working capital, repaid after harvest. Many farmers borrow RM7,000–10,000 for about three hectares."
  fact_hand_vs_machine: "Tractor and harvester hire keeps rising because diesel for farming is unsubsidised. Doing it by hand saves money but costs time."
  fact_padi_angin: "Weedy rice (padi angin) is a wild form of rice. It looks like padi but grows taller and drops its grain early. In the MADA area it can cut yields by 60–90%."
  fact_phone_rice: "Drying a wet phone in rice is a myth. Apple advises against it: rice dust can get inside. Let it air-dry instead."

